<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-eval'; style-src 'none'; img-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>AI Assist — Web foundations</title>
  <script defer src="markdown.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <h1>AI Assist</h1>
  <p>Local web UI foundations</p>
  <p id="status" role="status" aria-live="polite">Connecting…</p>
  <button id="refresh" type="button">Refresh models</button>
  <label>Model <select id="model" aria-label="Model"></select></label>
  <label>Context (empty = automatic) <input id="context" type="number" min="2048" max="1048576" step="1" value="16384"></label>
  <h2>Chats</h2>
  <button id="new-chat" type="button">New chat</button>
  <button id="same-environment" type="button" disabled>New chat, same environment</button>
  <button id="compact" type="button" disabled>Compact older messages</button>
  <p id="context-usage">Context usage: unknown</p>
  <ul id="chats"></ul>
  <h2 id="chat-title">Conversation</h2>
  <div id="messages" aria-label="Conversation"></div>
  <form id="composer">
    <label>Message <textarea id="prompt" rows="4" required></textarea></label>
    <button id="send" type="submit" disabled>Send</button>
    <button id="stop" type="button" disabled>Stop</button>
  </form>
</body>
</html>
