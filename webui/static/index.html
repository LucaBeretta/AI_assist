<!doctype html>
<html lang="en" data-theme="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>AI Assist</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="markdown.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
<div class="app">
  <div class="shell">
    <aside class="sidebar" aria-label="Chats">
      <div class="brand">
        <span class="brand-name"><svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 9-8 9-8-9z"></path></svg>AI Assist</span>
        <button id="new-chat" class="icon-btn bordered" type="button" aria-label="New chat" title="New chat · Ctrl+N">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
        </button>
      </div>
      <span class="section-label">Recent</span>
      <ul id="chats" class="chat-list"></ul>
      <div class="sidebar-spacer"></div>
      <button id="refresh" class="btn ghost" type="button" title="Reload the model list">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"></path></svg>Refresh models
      </button>
    </aside>

    <main class="main">
      <header class="header">
        <h1 id="chat-title">Conversation</h1>
        <div class="header-actions">
          <button id="theme" class="icon-btn" type="button" aria-label="Switch theme" title="Switch theme · Ctrl+Shift+L">
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
          </button>
        </div>
      </header>

      <section class="conversation" aria-label="Conversation">
        <div id="messages" class="thread"></div>
      </section>

      <div class="composer-wrap">
        <form id="composer" class="composer">
          <label class="sr-only" for="prompt">Message</label>
          <textarea id="prompt" rows="2" required placeholder="Reply to AI Assist…"></textarea>
          <div class="composer-bar">
            <label class="model-pick"><span class="sr-only">Model</span><select id="model" aria-label="Model"></select></label>
            <label title="Context length in tokens (empty = automatic)"><span class="sr-only">Context length</span><input id="context" class="ctx-input" type="number" min="2048" max="1048576" step="1" value="16384" placeholder="auto"></label>
            <span class="grow"></span>
            <details id="context-menu" class="ctx">
              <summary title="Context: compact or start a new chat with the same setup">
                <meter id="context-meter" min="0" max="1" low="0.8" high="0.95" optimum="0" value="0"></meter>
                <span id="context-usage">–</span>
              </summary>
              <div class="ctx-panel" role="menu">
                <button id="compact" class="menu-item" type="button" role="menuitem" disabled>
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4"></path></svg>
                  <span><span class="menu-title">Compact conversation</span><span class="menu-hint">Summarize older messages with this model; the latest stay as they are. Originals remain viewable.</span></span>
                </button>
                <button id="same-environment" class="menu-item" type="button" role="menuitem" disabled>
                  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="M12 8v8M8 12h8"></path></svg>
                  <span><span class="menu-title">New chat, same environment</span><span class="menu-hint">Same model, context, instructions, pinned files and memory, empty conversation.</span></span>
                </button>
              </div>
            </details>
            <button id="stop" class="stop-btn" type="button" aria-label="Stop" title="Stop · Esc" disabled></button>
            <button id="send" class="send-btn" type="submit" aria-label="Send" title="Send · Enter" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"></path></svg>
            </button>
          </div>
        </form>
        <span class="footnote">Everything runs on this computer. Answers can be wrong.</span>
      </div>
    </main>
  </div>

  <footer class="statusbar">
    <span id="status" class="status-engine" role="status" aria-live="polite">Connecting…</span>
    <span class="grow"></span>
    <span class="privacy">local only</span>
  </footer>
</div>
</body>
</html>
