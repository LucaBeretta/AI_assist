name: AI Assist integration verification

on:
  push:
    branches:
      - 'integration/compute-dashboard-web'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python and web tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Syntax check
        run: python -m compileall -q .
      - name: Full unit test suite
        run: python -m unittest discover -v
