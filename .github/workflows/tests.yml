# Run the whole test suite on Windows, macOS and Linux for every push and pull request.
# Tests use simulated responses and temporary folders: no window opens, nothing goes online,
# and no Ollama or Colibri installation is needed.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older, now outdated run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # Report every platform, even when one of them fails.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      # The same Python version the launchers download (python-runtime.txt).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      # Frontend and VS Code extension tests run through Node.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        # cryptography is optional for the app; installing it here lets the LAN pairing TLS tests run.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt cryptography

      - name: Compile check
        run: python -m compileall -q .

      - name: Python and frontend tests
        run: python -m unittest discover -v -p "test_*.py"

      - name: VS Code extension tests
        run: node --test vscode-extension/extension.test.js
