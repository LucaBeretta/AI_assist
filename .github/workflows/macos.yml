name: macOS desktop checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      native_smoke:
        description: Run the WKWebView smoke test in the hosted macOS desktop
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  headless:
    runs-on: macos-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - name: Run the headless suite with the default macOS temporary paths
        run: |
          export AI_ASSIST_DATA_DIR="$(mktemp -d "$RUNNER_TEMP/ai-assist.XXXXXX")"
          python -m unittest discover
          node --test vscode-extension/extension.test.js

  native-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.native_smoke
    needs: headless
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -B -m tools.native_smoke
