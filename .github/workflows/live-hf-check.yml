# Temporary: checks pull request #20 against the live Hugging Face site and a real Ollama.
# Lives only on the live-check-huggingface branch, which is deleted afterwards.
name: Live Hugging Face check

on:
  push:
    branches: [live-check-huggingface]

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - name: Read Hugging Face with the new code
        id: suggest
        run: python live_check_huggingface.py
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Pull the suggested tag with a real Ollama
        run: |
          (ollama serve > ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/version && break; sleep 1; done
          echo "Pulling ${{ steps.suggest.outputs.tag }}"
          ollama pull "${{ steps.suggest.outputs.tag }}"
          ollama list
